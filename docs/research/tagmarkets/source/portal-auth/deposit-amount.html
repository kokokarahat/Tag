			<script type="text/javascript">
				var decimal_no = 2;
				var currency_settings_number_format = 'application';
				var depositbuddy_show_other_amount_default = 0;							

				var checkScrWidth = function () {
					// fix for other amount button in smaller screens
				    var w = window.innerWidth;
				    if (w < 1600) {
				    	$('.btn-other-amount').html('Other')
				    }
				    else {
				    	$('.btn-other-amount').html('Other amount')
				    }
				}

				var getPSPSelectionView = function(params) {
					var amount = typeof params.amount !== 'undefined' ? params.amount : 0;
					var currency_id = typeof params.currency_id !== 'undefined' ? params.currency_id : 0;
					var currency = typeof params.currency !== 'undefined' ? params.currency : '';
					var currency_sign = typeof params.currency_sign !== 'undefined' ? params.currency_sign : 0;
					var skip_currency_selection = typeof params.skip_currency_selection !== 'undefined' ? params.skip_currency_selection : 0;

					$.ajax({
						url: '/cfc/controller.cfc?method=getPSPSelectionView',
						type: 'POST',
						data: {
							amount    	  : amount,
							currency_id   : currency_id,
							currency      : currency,
							currency_sign : currency_sign,
							skip_currency_selection : skip_currency_selection,
							additional_data : ''
						},
					})
					.done(function(result) {
						$('.modal-deposit-view').removeClass('modal-smc');
						$('.modal-deposit-view').addClass('modal-lg');
						$('.deposit-view-content').html(result).fadeIn();
					});
				}

				function renderPredefinedAmounts(predefined_amounts, decimal_len) {
					var BTN_RESIZE_DECIMAL_LENGTH = 6;
					var decimal_length = decimal_len ? decimal_len : 2;
					var currency_sign = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').data('currency_sign');				
					var $col_other_amount = $('.col-other-amount');

					
					$('.currency_sign').html(currency_sign);
					$('.error_message_amount_selected').fadeOut();
					$('.other_amount_data').val('');

					if (depositbuddy_show_other_amount_default == 0) {
						$('.other_amount_placeholder').fadeOut();
					}
					
					if (predefined_amounts.length === 0) {
						$('.select_amount').fadeOut();
						$('.other_amount').fadeOut();
						$('.amount_container').empty();

						$('.deposit-view-content').LoadingOverlay('hide');
						return;
					}

					var amount_container_content = '';
					predefined_amounts.forEach(function(item) {
						amount_container_content += `
							<div class="col-xs-12 col-sm-12s ${decimal_length >= BTN_RESIZE_DECIMAL_LENGTH ? 'col-md-6 col-lg-6' : 'col-md-4 col-lg-4'}">
								<button type="button" class="btn btn-block btn-theme-primary btn-amount-select margin-bottom-10" data-amount="${item.amount}" data-currency_sign="${item.sign}">
									${item.sign+item.formatted_amount}
								</button>
							</div>
						`;
					});

					if (decimal_length >= BTN_RESIZE_DECIMAL_LENGTH) {
						$col_other_amount.addClass('col-md-6 col-lg-6');
						$col_other_amount.removeClass('col-md-4 col-lg-4');
					} else {
						$col_other_amount.addClass('col-md-4 col-lg-4');
						$col_other_amount.removeClass('col-md-6 col-lg-6');
					}

					$('.amount_container').html(amount_container_content);
					$('.deposit-view-content').LoadingOverlay('hide');
				}

				$(document).ready(function() {

					

					$('.deposit-view-content').on('change', '.deposit-currency-select,.deposit-currency-radio', function() {
						var currency 		= $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').val();
						var currency_id 	= $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').data('currency_id');

						$('.deposit-view-content').LoadingOverlay('show', {
							background  : 'rgba(255, 255, 255, 0.8)',
							image		: '',
							fontawesome : 'fal fa-spinner fa-spin',
							fontawesomeResizeFactor: 0.4
						});

						$.ajax({
							url: '/cfc/controller.cfc?method=getPredefinedAmountsJSON',
							type: 'POST',
							data: {
								currency_name: currency,
								currency_id: currency_id,
								type: 'DEPOSIT',
								transaction_method: 'WIRE'
							}
						}).done(function(response) {
							var predefinedAmounts = JSON.parse(response);

							$.ajax({
								url: '/cfc/controller.cfc?method=getCurrencySetting',
								type: 'POST',
								data: {
									currency,
									setting_name: 'DECIMAL_LENGTH'
								}
							}).done(function(response) {
								var decimal_length = parseInt(JSON.parse(response).DECIMAL_LENGTH);

								renderPredefinedAmounts(predefinedAmounts, decimal_length);
							}).fail(function() {
								console.log('Error fetching currency decimal length');

								renderPredefinedAmounts(predefinedAmounts);
							});
						}).fail(function() {
							console.log('Error fetching predefined amounts');
						})
					});

					$('.deposit-view-content').off('click', '.btn-amount-select').on('click', '.btn-amount-select', function() {					
						var selected_amount = $(this).attr('data-amount');					
						var currency 		= $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').val();
						var currency_id 	= $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').data('currency_id');
						var currency_sign = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-currency_sign');

						var min_deposit = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-min_deposit');
						var min_deposit_formatted = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-min_deposit_formatted');
						var max_deposit = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-max_deposit');
						var max_deposit_formatted = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-max_deposit_formatted');
						$('.amount_container_hidden').html('<input type="hidden" name="amount_selected_hidden" id="amount_selected_hidden" value="'+selected_amount+'">');

						// remove any errors when selecting other amount
						$('.other_amount_placeholder').hide();
						$('.input-other-amount').closest('.input-group').removeClass('has-error');
						$('.input-other-amount').closest('.input-group').parent().find('.error_message_deposit_error_other').hide();

						// remove comma from amount
						selected_amount = selected_amount.replace(/,/g,'');
						selected_amount = number.SCAmountFormat({amount: selected_amount, currency: currency});

						finrules.checkShowHideRulesJSON({
							 publish : 1
							,transaction_type : 'DEPOSIT'
							,transaction_method : 'CREDITCARD'
							,currency : currency
							,deny_tx : 1
							,amount : selected_amount
							,onSuccess : function () {														
								if (parseFloat(min_deposit) > 0 && (parseFloat(selected_amount) < parseFloat(min_deposit))){
									$('.error_message_deposit_error').html('The minimum deposit amount for this currency is: ' + currency_sign + min_deposit_formatted);
									$('.error_message_deposit_error').fadeIn();
									return;
								}

								if (parseFloat(max_deposit) > 0 && (parseFloat(selected_amount) > parseFloat(max_deposit))) {
									$('.error_message_deposit_error').html('The maximum deposit amount for this currency is: ' + currency_sign + max_deposit_formatted);
									$('.error_message_deposit_error').fadeIn();
									return;
								}

								getPSPSelectionView({
									amount : selected_amount,
									currency_id : currency_id
								});
							}
							,onFail : function () {							
							}
						});
					});

					var dropdown_length = $('.deposit-currency-select').children('option').length;

					if(dropdown_length == 1){
						$('.deposit-currency-select').addClass('hidden');
						$('.choose_currency-lang').addClass('hidden');					
					}

					// 1536 
					if ($('.deposit-currency-radio:checked').length > 0) { //1536 
						$('.deposit-currency-radio:checked').trigger('change'); //1536 
					} else {//1536 
						$('.deposit-currency-select').trigger('change'); //not 1536 
					}//1536 

					$('.other_amount').on('click', function() {
						$('.error_message_deposit_error').hide();
						$('.error_message_deposit_error_other').hide();
						$('.input-other-amount').closest('.input-group').removeClass('has-error');
						$('.input-other-amount').val('');
						$('.other_amount_data').val('other');
						$('.error_message_amount_selected').fadeOut();
						$('.other_amount_placeholder').fadeIn();
					});

					if(depositbuddy_show_other_amount_default == 1){
						$('.other_amount').trigger('click');
						$('.other_amount').addClass('hidden');
					}

					$('.btn-deposit-next').on('click', function(){
						var current_amount = $('.input-other-amount').val();
						if (current_amount == "") {
							$('.error_message_amount_selected').fadeIn();
						}

						var selected_amount = $('.input-other-amount').val().replace(/\,/g,'');
						var currency 	    = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').val();
						var currency_id = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-currency_id');
						var currency_sign = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-currency_sign');
						var min_deposit = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-min_deposit');
						var min_deposit_formatted = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-min_deposit_formatted');
						var max_deposit = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-max_deposit');
						var max_deposit_formatted = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').attr('data-max_deposit_formatted');
						
						min_deposit = number.SCAmountFormat({amount: min_deposit, currency: currency});
						max_deposit = number.SCAmountFormat({amount: max_deposit, currency: currency});
													
						$('.amount_container_hidden').html('<input type="hidden" name="amount_selected_hidden" id="amount_selected_hidden" value="'+selected_amount+'">');

						$('.input-other-amount').closest('.input-group').removeClass('has-error');
						$('.input-other-amount').closest('.input-group').parent().find('.error_message_amount_entered').fadeOut();
						$('.error_message_deposit_error').hide();

						if (selected_amount == "") {
							$('.input-other-amount').closest('.input-group').addClass('has-error');
							$('.input-other-amount').closest('.input-group').parent().find('.error_message_amount_entered').fadeIn();
							return;
						}	

						// remove comma from amount
						selected_amount = selected_amount.replace(/,/g,'');
						selected_amount = number.SCAmountFormat({amount: selected_amount, currency: currency});
											
						finrules.checkShowHideRulesJSON({
							publish : 1
							,transaction_type : 'DEPOSIT'
							,transaction_method : 'CREDITCARD'
							,deny_tx : 1
							,amount : selected_amount
							,currency : currency
							,onSuccess : function () {							
								if (parseFloat(min_deposit) > 0 && (parseFloat(selected_amount) < parseFloat(min_deposit))){								
									$('.error_message_deposit_error').html('The minimum deposit amount for this currency is: ' + currency_sign + min_deposit_formatted);
									$('.error_message_deposit_error').fadeIn();
									return;
								}

								if (parseFloat(max_deposit) > 0 && (parseFloat(selected_amount) > parseFloat(max_deposit))) {								
									$('.error_message_deposit_error').html('The maximum deposit amount for this currency is: ' + currency_sign + max_deposit_formatted);
									$('.error_message_deposit_error').fadeIn();
									return;
								}

								getPSPSelectionView({
									amount : selected_amount,								
									currency : currency,
									currency_id : currency_id,
									currency_sign : currency_sign
								});
							}
							,onFail : function () {

							}
						});				
					});

					checkScrWidth();

				    $( window ).resize(function(){
				    	checkScrWidth();
				    });

				    $('.make-deposit-title').html('Make a Deposit');

					$('#input_other_amount').on('keyup', function() {
						$(this).val(number.validate($(this).val()));

						$(this).parent().removeClass('has-error');
						$(this).html('');
					});

					$('#input_other_amount').on('blur', function() {
						var $amount = $(this);
						var amount = parseFloat($amount.val() || 0);
						var currency = $('input[name="deposit-currency-select"]:checked, .deposit-currency-select :selected').val();

						if (amount > 0 && currency !== '') {
							var formatted_amount = number.SCAmountFormat({ amount, currency });

							$amount.val(formatted_amount);
							return;
						}

						$amount.val('');
					});

					
				});
			</script>
